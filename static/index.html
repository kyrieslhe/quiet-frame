<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>const savedTheme=localStorage.getItem("quiet-frame-theme");document.documentElement.dataset.theme=savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</script>
  <title>留影 — Quiet Frame</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="sidebar">
    <a class="brand" href="#" aria-label="Quiet Frame"><span>Quiet<br>Frame<span class="brand-dot">.</span></span><span class="brand-cn">留影</span></a>
    <nav class="primary-nav" data-aria="navigation">
      <a href="#" id="home-link" class="active"><span data-i18n="works"></span><span class="nav-count" id="nav-count">00</span></a>
      <button id="about-button" data-i18n="about"></button>
    </nav>
    <nav class="series-nav" id="series-nav" data-aria="works"></nav>
    <div class="sidebar-bottom">
      <div class="theme-switch" data-aria="appearance"><button id="theme-light" data-theme-choice="light" aria-pressed="true"><i class="light-swatch"></i><span data-i18n="light"></span></button><button id="theme-dark" data-theme-choice="dark" aria-pressed="false"><i class="dark-swatch"></i><span data-i18n="dark"></span></button></div>
      <div class="language" data-aria="language"><button id="lang-zh" lang="zh" aria-pressed="true">中文</button><span>/</span><button id="lang-en" lang="en" aria-pressed="false">EN</button></div>
      <a class="backup" href="/api/backup" data-i18n="backup"></a>
      <span class="local"><i></i><span data-i18n="local"></span></span>
    </div>
  </header>
  <div class="content"><main id="main"></main><footer><span>© QUIET FRAME</span><span data-i18n="footer"></span><span id="footer-count"></span></footer></div>
  <dialog id="album-dialog">
    <form id="album-form">
      <div class="dialog-head"><span class="eyebrow" data-i18n="collection"></span><button type="button" class="close" data-close data-aria="close">×</button></div>
      <h2 id="album-form-heading"></h2>
      <label><span data-i18n="albumTitle"></span><input name="title" data-placeholder="albumPlaceholder" required maxlength="200"></label>
      <div class="form-row"><label><span data-i18n="location"></span><input name="location" data-placeholder="locationPlaceholder"></label><label><span data-i18n="date"></span><input name="date" type="date"></label></div>
      <label><span data-i18n="description"></span><textarea name="description" rows="3" data-placeholder="descriptionPlaceholder"></textarea></label>
      <button class="primary" type="submit"><span data-i18n="saveAlbum"></span><span>↗</span></button>
    </form>
  </dialog>
  <dialog id="photo-dialog" class="photo-dialog">
    <div class="lightbox">
      <div class="photo-stage"><button class="close lightbox-close" data-close data-aria="close">×</button><button class="arrow prev" id="prev" data-aria="previous">←</button><img id="large-photo" alt=""><button class="arrow next" id="next" data-aria="next">→</button><span id="photo-counter"></span></div>
      <aside><div class="dialog-head"><span class="eyebrow" data-i18n="photoDetails"></span></div><h2 id="photo-heading"></h2><div id="photo-read"></div><form id="photo-form" hidden></form><div id="photo-actions"><button class="outline" id="edit-photo" data-i18n="editPhoto"></button><button class="text-button" id="set-cover" data-i18n="setCover"></button><a id="download-original" class="text-button" data-i18n="download"></a><button class="text-button danger" id="delete-photo" data-i18n="deletePhoto"></button></div></aside>
    </div>
  </dialog>
  <dialog id="about-dialog"><div class="dialog-head"><span class="eyebrow">QUIET FRAME / 留影</span><button class="close" data-close data-aria="close">×</button></div><h2 data-i18n="aboutTitle"></h2><p data-i18n="aboutIntro"></p><p data-i18n="aboutFormats"></p><p data-i18n="aboutGps"></p><p data-i18n="aboutBackup"></p><a href="https://github.com/kyrieslhe/quiet-frame" target="_blank" rel="noreferrer" class="about-source">GITHUB ↗</a><small>OPEN SOURCE · MIT LICENSE</small></dialog>
  <dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="confirm-actions"><button class="outline" id="confirm-cancel" data-i18n="cancel"></button><button class="primary danger-bg" id="confirm-ok" data-i18n="delete"></button></div></dialog>
  <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/tiff" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/i18n.js"></script><script src="/static/app.js"></script>
</body>
</html>
